[project]
name = "bizwiz"
version = "0.1.0"
description = "Ask questions of your business data and get cited answers."
authors = [
    { name = "Garuka ranasinghe", email = "garukar9895@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv.build-backend]
module-root = ""

[project.scripts]
bizwiz-api = "bizwiz.api:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the Postgres container (docker compose up -d db)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
